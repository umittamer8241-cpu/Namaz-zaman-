name: Play Bundle Önizleme

on:
  push:
    branches: [play-prep, v0.9-adhan-library, feature/v09-learning-tracker-20261107, feature/v09-daily-dua-full-sequential-20261107]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Android API 36 kur
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 12 dil ve metin tamlığı testi
        run: node tools/validate_localization.js
      - name: Dinî öğrenme, aylık namaz çizelgesi ve 12 dil kontrolü
        run: |
          node --check app/src/main/assets/surah_extended.js
          node --check app/src/main/assets/learning_content.js
          node --check app/src/main/assets/learning_ui.js
          node --check app/src/main/assets/prayer_tracker.js
          node --check app/src/main/assets/esma_i18n.js
          node tools/validate_learning.js
          node tools/validate_dua_sequence.js
          node tools/validate_v026_daily_learning.js
          node tools/validate_esma_i18n.js
          node tools/validate_prayer_calendar.js
          node tools/validate_royal_compass.js
          node tools/validate_compass_heading.js
          node tools/validate_v024_compass_arbitration.js
          node --check app/src/main/assets/auto_qibla.js
          node tools/validate_v025_embedded_qibla.js
          node tools/validate_test_installer.js
          node tools/validate_v016_diagnostics.js
          node tools/validate_full_apk.js
          node tools/validate_calendar_editor.js
          node tools/validate_location_recovery.js
          node tools/validate_v019_offline_sun.js
          node tools/validate_v019_qibla_reference.js
          node tools/validate_v019_online.js
          node tools/validate_v020_location_diagnostics.js
          node tools/validate_v021_resume_gps.js
          node --check app/src/main/assets/location_hub.js
          node tools/validate_v022_premium_hub.js
          node tools/validate_v023_auto_location.js
          node --check app/src/main/assets/location_diagnostics.js
          node --check app/src/main/assets/location_hub.js
      - name: Sabit imza anahtarını güvenli kur
        env:
          NAMAZ_PREVIEW_KEYSTORE_B64: ${{ secrets.NAMAZ_PREVIEW_KEYSTORE_B64 }}
          NAMAZ_PREVIEW_STORE_PASSWORD: ${{ secrets.NAMAZ_PREVIEW_STORE_PASSWORD }}
        run: |
          test -n "$NAMAZ_PREVIEW_KEYSTORE_B64"
          test -n "$NAMAZ_PREVIEW_STORE_PASSWORD"
          printf '%s' "$NAMAZ_PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/namaz-preview.p12"
          chmod 600 "$RUNNER_TEMP/namaz-preview.p12"
          echo "NAMAZ_PREVIEW_KEYSTORE_FILE=$RUNNER_TEMP/namaz-preview.p12" >> "$GITHUB_ENV"
      - name: Play önizleme APK ve AAB derle
        env:
          NAMAZ_PREVIEW_STORE_PASSWORD: ${{ secrets.NAMAZ_PREVIEW_STORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleFullPreview :app:bundleRelease
      - name: Sabit APK imza sertifikasını doğrula
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/fullPreview/app-fullPreview.apk | grep -qi '66d05bc5d1a05c70aaa703b041a599dcdda446f50f3d7b8811efdad094c8a323'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -qi '66d05bc5d1a05c70aaa703b041a599dcdda446f50f3d7b8811efdad094c8a323'
      - name: Debug APK test paket adını doğrula
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "name='com.geminamaz.app.qiblatest'"
      - name: Mevcut uygulamayı silmeden kurulabilen pusula test APK
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Zamani-v0.26-Gunluk-Dua-Sure-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Normal Namaz Zamanı APK paket kimliğini doğrula
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/fullPreview/app-fullPreview.apk | grep -q "name='com.geminamaz.app'"
      - name: Normal uygulama adıyla tam Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Zamani-v0.26-Gunluk-Dua-Sure-Tam-APK
          path: app/build/outputs/apk/fullPreview/app-fullPreview.apk
          if-no-files-found: error
      - name: İmzasız AAB önizleme
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Zamani-Play-Preview-UNSIGNED-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
