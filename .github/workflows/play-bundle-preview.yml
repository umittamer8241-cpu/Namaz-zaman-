name: Play Bundle Önizleme

on:
  push:
    branches: [play-prep, v0.9-adhan-library, feature/v09-learning-tracker-20261107, feature/v09-daily-dua-full-sequential-20261107]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Android API 36 kur
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 12 dil ve metin tamlığı testi
        run: node tools/validate_localization.js
      - name: Lisansli ezan dosyalari, hash ve 12 dil kontrolu
        if: github.ref_name == 'v0.9-adhan-library' || github.ref_name == 'feature/v09-learning-tracker-20261107' || github.ref_name == 'feature/v09-daily-dua-full-sequential-20261107'
        run: node tools/validate_adhan.js
      - name: v0.9 sure, dua, Esma ve namaz takibi kalite testleri
        if: github.ref_name == 'feature/v09-learning-tracker-20261107' || github.ref_name == 'feature/v09-daily-dua-full-sequential-20261107'
        run: |
          node --check app/src/main/assets/learning_content.js
          node --check app/src/main/assets/learning_ui.js
          node --check app/src/main/assets/prayer_tracker.js
          node tools/validate_learning.js
          node tools/validate_dua_sequence.js
      - name: Play önizleme APK ve AAB derle
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease
      - name: İç test APK
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Zamani-Play-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: İmzasız AAB önizleme
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Zamani-Play-Preview-UNSIGNED-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
