name: v0.23 Pusula Test APK Yayimla

on:
  push:
    tags:
      - 'v0.23.0-compass-test'

permissions:
  actions: read
  contents: write

jobs:
  publish-tested-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Derlenmis ve paket kimligi dogrulanmis test APK dosyasini al
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download 42387043916 \
            --repo "${{ github.repository }}" \
            --name Namaz-Zamani-v0.23-Gorunur-Pusula-YanYana-APK \
            --dir artifact
          test -s artifact/app-debug.apk
          mv artifact/app-debug.apk artifact/Namaz-Zamani-v0.23-Pusula-Test.apk

      - name: Test APK icin on surum yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifact/Namaz-Zamani-v0.23-Pusula-Test.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Namaz Zamani v0.23 - Gorunur Pusula Testi" \
            --prerelease \
            --notes "Bu, yalnizca test icin derlenen, mevcut Namaz Zamani ve v0.22 testini silmeden yan yana kurulabilen Android APK'dir. Uygulama kimligi com.geminamaz.app.pusulatest23. GPS konum hesaplama, eski konumun korunmasi ve sensor dogruluyken canli, dogrulanmamisken yalniz kuzey-ustte sematik kible oku icerir. Sematik ok telefonun gercek fiziksel yonunu gostermez. Bu paket Google Play son kullanici surumu degildir."
