name: Namaz Zamanı APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kontrol et
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - name: SDK 35 paketlerini kur
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK derle
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: APK dosyasını ekle
        uses: actions/upload-artifact@v4
        with:
          name: Namaz-Zamani-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
