plugins { id 'com.android.application' }

android {
    namespace 'com.geminamaz.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.geminamaz.app'
        minSdk 24
        targetSdk 36
        versionCode 26
        versionName '0.25-embedded-auto-qibla-preview'
    }
    signingConfigs {
        stablePreview {
            // Private signing material lives only in GitHub Actions Secrets.
            def keyPath = System.getenv('NAMAZ_PREVIEW_KEYSTORE_FILE')
            def secret = System.getenv('NAMAZ_PREVIEW_STORE_PASSWORD')
            if (keyPath != null && secret != null) {
                storeFile file(keyPath)
                storePassword secret
                keyAlias 'namaz-preview'
                keyPassword secret
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            // New stable test-app ID avoids prior temporary debug key
            // collisions and remains unchanged in future updates.
            applicationIdSuffix '.qiblatest'
            versionNameSuffix '-side-by-side'
            signingConfig signingConfigs.stablePreview
        }
        fullPreview {
            // Complete installable APK under the normal Namaz Zamani package ID.
            // Stable PKCS12 certificate from private GitHub Actions secrets.
            // This is a preview key and is NOT a Google Play signing key.
            initWith release
            signingConfig signingConfigs.stablePreview
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}
