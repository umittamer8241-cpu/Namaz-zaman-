plugins { id 'com.android.application' }

android {
    namespace 'com.geminamaz.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.geminamaz.app'
        minSdk 24
        targetSdk 36
        versionCode 14
        versionName '0.13-prayer-calendar-compass-pro-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}
