plugins { id 'com.android.application' }

android {
    namespace 'com.geminamaz.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.geminamaz.app'
        minSdk 24
        targetSdk 36
        versionCode 17
        versionName '0.16-dual-heading-diagnostic-preview'
    }
    buildTypes {
        debug {
            // Standalone QA app: never overwrite the user's existing prayer records.
            applicationIdSuffix '.pusulatest'
            versionNameSuffix '-side-by-side'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}
